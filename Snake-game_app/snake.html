<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Snake - Nokia 3310</title>
<style>
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: 'Courier New', monospace;
    color: #9bbc0f;
  }

  .phone-screen {
    background: #8bac0f;
    border: 12px solid #333;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }

  #gameCanvas {
    background: #9bbc0f;
    display: block;
    image-rendering: pixelated;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    width: 400px;
    font-size: 16px;
    font-weight: bold;
    color: #0f380f;
    margin-bottom: 6px;
    padding: 0 4px;
  }

  .info {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    color: #9bbc0f;
  }
</style>
</head>
<body>

<div class="phone-screen">
  <div class="hud">
    <span>SCORE: <span id="score">0</span></span>
    <span>NIVEL: <span id="level">1</span></span>
    <span>HIGH: <span id="highscore">0</span></span>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
</div>

<div class="info">
  Usa as setas do teclado para jogar &bull; Espaço para pausar/reiniciar<br>
  A cada 5 maçãs avanças de mapa (nível 1 = mais fácil, nível 50 = mais difícil)
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highscoreEl = document.getElementById('highscore');
const levelEl = document.getElementById('level');

const gridSize = 20;
const tileCount = canvas.width / gridSize;
const MAX_LEVEL = 50;
const FOOD_PER_LEVEL = 5;
const center = Math.floor(tileCount / 2);

let snake = [{ x: 10, y: 10 }];
let velocity = { x: 0, y: 0 };
let food = { x: 15, y: 15 };
let score = 0;
let level = 1;
let foodEatenThisLevel = 0;
let highscore = localStorage.getItem('snakeHighscore') || 0;
let gameOver = false;
let gameStarted = false;
let speed = 120; // ms por frame, estilo Nokia (mais lento que jogos modernos)
let lastTime = 0;
let obstacles = new Set();

highscoreEl.textContent = highscore;
levelEl.textContent = level;

// ---------- Gerador de números pseudo-aleatórios com seed (um mapa fixo por nível) ----------
function seededRandom(seed) {
  let t = seed >>> 0;
  return function () {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

function inSafeZone(x, y) {
  return Math.abs(x - center) <= 2 && Math.abs(y - center) <= 2;
}

function inBounds(x, y) {
  return x >= 1 && x < tileCount - 1 && y >= 1 && y < tileCount - 1;
}

// ---------- Geração procedural dos 50 mapas (obstáculos únicos, dificuldade crescente) ----------
function generateObstacles(lvl) {
  const rng = seededRandom(lvl * 7919 + 13);
  const cells = new Set();

  const addCell = (x, y) => {
    if (inBounds(x, y) && !inSafeZone(x, y)) cells.add(x + ',' + y);
  };

  // paredes: mais numerosas e compridas quanto maior o nível
  const wallSegments = 1 + Math.floor(lvl / 3);
  for (let i = 0; i < wallSegments; i++) {
    const orientation = rng() < 0.5 ? 'h' : 'v';
    const length = 2 + Math.floor(rng() * 5);
    const startX = Math.floor(rng() * tileCount);
    const startY = Math.floor(rng() * tileCount);
    for (let j = 0; j < length; j++) {
      const x = orientation === 'h' ? startX + j : startX;
      const y = orientation === 'v' ? startY + j : startY;
      addCell(x, y);
    }
  }

  // blocos soltos, mais densos em níveis avançados
  const scatterCount = Math.floor(lvl * 1.3);
  for (let i = 0; i < scatterCount; i++) {
    const x = Math.floor(rng() * tileCount);
    const y = Math.floor(rng() * tileCount);
    addCell(x, y);
  }

  // a partir do nível 30, pequenas salas com entrada
  if (lvl > 30) {
    const rooms = Math.floor((lvl - 30) / 4) + 1;
    for (let r = 0; r < rooms; r++) {
      const rx = 2 + Math.floor(rng() * (tileCount - 8));
      const ry = 2 + Math.floor(rng() * (tileCount - 8));
      const w = 3 + Math.floor(rng() * 3);
      const h = 3 + Math.floor(rng() * 3);
      const gapSide = Math.floor(rng() * 4);
      for (let x = rx; x < rx + w; x++) {
        for (let y = ry; y < ry + h; y++) {
          const isEdge = x === rx || x === rx + w - 1 || y === ry || y === ry + h - 1;
          if (!isEdge) continue;
          if (gapSide === 0 && y === ry && x === rx + Math.floor(w / 2)) continue;
          if (gapSide === 1 && y === ry + h - 1 && x === rx + Math.floor(w / 2)) continue;
          if (gapSide === 2 && x === rx && y === ry + Math.floor(h / 2)) continue;
          if (gapSide === 3 && x === rx + w - 1 && y === ry + Math.floor(h / 2)) continue;
          addCell(x, y);
        }
      }
    }
  }

  return cells;
}

function placeFood() {
  let tries = 0;
  while (tries < 500) {
    const fx = Math.floor(Math.random() * tileCount);
    const fy = Math.floor(Math.random() * tileCount);
    const key = fx + ',' + fy;
    const onSnake = snake.some(s => s.x === fx && s.y === fy);
    if (!onSnake && !obstacles.has(key)) {
      food = { x: fx, y: fy };
      return;
    }
    tries++;
  }
  food = { x: center, y: center };
}

function loadLevel(lvl) {
  level = lvl;
  levelEl.textContent = level;
  obstacles = generateObstacles(lvl);
  placeFood();
}

function update() {
  if (!gameStarted || gameOver) return;

  const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

  // colisão com paredes
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    endGame();
    return;
  }

  // colisão com obstáculos do mapa
  if (obstacles.has(head.x + ',' + head.y)) {
    endGame();
    return;
  }

  // colisão com o próprio corpo
  for (let seg of snake) {
    if (seg.x === head.x && seg.y === head.y) {
      endGame();
      return;
    }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    foodEatenThisLevel++;

    if (foodEatenThisLevel >= FOOD_PER_LEVEL && level < MAX_LEVEL) {
      foodEatenThisLevel = 0;
      loadLevel(level + 1);
    } else {
      placeFood();
    }

    // aumenta ligeiramente a velocidade, como no jogo original
    if (speed > 60) speed -= 2;
  } else {
    snake.pop();
  }
}

function draw() {
  // fundo
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // grelha subtil (opcional, visual retro)
  ctx.strokeStyle = '#8bac0f';
  for (let i = 0; i <= tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0);
    ctx.lineTo(i * gridSize, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * gridSize);
    ctx.lineTo(canvas.width, i * gridSize);
    ctx.stroke();
  }

  // obstáculos do mapa
  ctx.fillStyle = '#0f380f';
  obstacles.forEach(key => {
    const [x, y] = key.split(',').map(Number);
    const px = x * gridSize, py = y * gridSize;
    ctx.fillRect(px + 1, py + 1, gridSize - 2, gridSize - 2);
    ctx.strokeStyle = '#9bbc0f';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px + 4, py + 4);
    ctx.lineTo(px + gridSize - 4, py + gridSize - 4);
    ctx.moveTo(px + gridSize - 4, py + 4);
    ctx.lineTo(px + 4, py + gridSize - 4);
    ctx.stroke();
  });

  // comida
  ctx.fillStyle = '#0f380f';
  ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

  // cobra
  ctx.fillStyle = '#0f380f';
  snake.forEach((seg, i) => {
    ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });

  if (!gameStarted) {
    ctx.fillStyle = '#0f380f';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('Prime ESPAÇO para começar', canvas.width / 2, canvas.height / 2);
  }

  if (gameOver) {
    ctx.fillStyle = '#0f380f';
    ctx.font = 'bold 26px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = 'bold 16px Courier New';
    ctx.fillText('Espaço para reiniciar', canvas.width / 2, canvas.height / 2 + 20);
  }
}

function endGame() {
  gameOver = true;
  if (score > highscore) {
    highscore = score;
    localStorage.setItem('snakeHighscore', highscore);
    highscoreEl.textContent = highscore;
  }
}

function resetGame() {
  snake = [{ x: 10, y: 10 }];
  velocity = { x: 0, y: 0 };
  score = 0;
  level = 1;
  foodEatenThisLevel = 0;
  speed = 120;
  scoreEl.textContent = score;
  levelEl.textContent = level;
  gameOver = false;
  gameStarted = false;
  loadLevel(1);
}

function gameLoop(timestamp) {
  if (timestamp - lastTime > speed) {
    lastTime = timestamp;
    update();
    draw();
  }
  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp':
      if (velocity.y !== 1) velocity = { x: 0, y: -1 };
      gameStarted = true;
      e.preventDefault();
      break;
    case 'ArrowDown':
      if (velocity.y !== -1) velocity = { x: 0, y: 1 };
      gameStarted = true;
      e.preventDefault();
      break;
    case 'ArrowLeft':
      if (velocity.x !== 1) velocity = { x: -1, y: 0 };
      gameStarted = true;
      e.preventDefault();
      break;
    case 'ArrowRight':
      if (velocity.x !== -1) velocity = { x: 1, y: 0 };
      gameStarted = true;
      e.preventDefault();
      break;
    case ' ':
      if (gameOver) {
        resetGame();
      } else {
        gameStarted = true;
      }
      e.preventDefault();
      break;
  }
});

loadLevel(1);
draw();
requestAnimationFrame(gameLoop);
</script>

</body>
</html>
